<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>React 19.2.4</title>

  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script>
    function genData2() {
      const ts = Array(2_000);
      const vals = Array(2_000);

      for (let i = 0; i < 2_000; i++) {
        ts[i] = 1773554800346 + i;
        vals[i] = Math.random() * 100
      }

      const data = Array(2_000);

      for (let i = 0; i < 2_000; i++) {
        data[i] = [
          ts.slice(),
          vals.slice(),
        ];
      }

      return data;
    }

    function App({ data }) {
      return React.createElement("div", null, data[0][1][0]);
    }

    const elem = document.getElementById("root");
    const root = ReactDOM.createRoot(elem);

    renderWithData();

    function renderWithData() {
      const data = genData2();

      root.render(React.createElement(App, { data: data }));
    }
  </script>

  <button onclick="renderWithData()">Update data!</button>
</body>

</html>
